name: Compare prediction models (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare models
        run: python scripts/compare_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: model-comparison-report
          path: model_comparison_report.json
