name: Experimental ML comparison (read-only archive)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: experimental-ml-comparison
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated ML dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2'
      - name: Train using read-only SQLite and freeze upcoming predictions
        run: python scripts/train_ml.py
      - name: Commit only separate ML JSON files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ml_predictions.json ml_prediction_history.json ml_metrics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update isolated ML predictions and metrics'
            git pull --rebase
            git push
          fi
