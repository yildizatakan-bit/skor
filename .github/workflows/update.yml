name: Update football archive
on:
  schedule:
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-archive-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update new matches and seed one historical competition
        env:
          SEED_BATCH: '1'
        run: python scripts/update_data.py
      - name: Commit durable database and published snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f match_archive.sqlite3
          git add data.json prediction_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update persistent football archive and snapshots'
            git pull --rebase
            git push
          fi
