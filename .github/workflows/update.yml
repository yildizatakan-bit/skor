name: Match data every 5 minutes
on:
  schedule:
    # Requested every 5 minutes (GitHub may delay scheduled jobs)
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh football data
        run: |
          # Full historical scan at 08:00 and 20:00 Türkiye time, or manual run.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(date -u +%H:%M)" == "05:00" || "$(date -u +%H:%M)" == "17:00" ]]; then
            FULL_REFRESH=1 python scripts/update_data.py
          else
            FULL_REFRESH=0 python scripts/update_data.py
          fi
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json prediction_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update football data snapshot"
            git push
          fi
