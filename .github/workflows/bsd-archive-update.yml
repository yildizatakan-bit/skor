name: BSD archive - backup then sync
on:
  workflow_dispatch:
  schedule:
    - cron: '29 2,8,14,20 * * *'
permissions:
  contents: write
concurrency:
  group: football-archive-update
  cancel-in-progress: false
jobs:
  backup-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing SQLite and archive
        run: |
          test -s match_archive.sqlite3
          git ls-files --error-unmatch match_archive.sqlite3
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:match_archive.sqlite3?mode=ro',uri=True)
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          n=c.execute('SELECT COUNT(*) FROM matches').fetchone()[0]
          assert n>0
          print('Existing archive intact:',n,'matches')
          PY
          test -s prediction_history.json
          test -s data.json
      - name: Preserve original ESPN database before any import
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          REF='refs/heads/backups/espn-before-bsd-v45'
          if git ls-remote --exit-code --heads origin "$REF" >/dev/null 2>&1; then
            echo 'Immutable backup branch already exists.'
          else
            git push origin HEAD:"$REF"
          fi
          REMOTE_SHA="$(git ls-remote --heads origin "$REF" | cut -f1)"
          test -n "$REMOTE_SHA"
          git fetch origin "$REF" --quiet
          BACKUP_DB_HASH="$(git rev-parse FETCH_HEAD:match_archive.sqlite3)"
          test -n "$BACKUP_DB_HASH"
          git cat-file -e FETCH_HEAD:prediction_history.json
          git cat-file -e FETCH_HEAD:data.json
          echo "Verified backup ref: $REF -> $REMOTE_SHA"
          echo "SQLite blob: $BACKUP_DB_HASH"
          echo "verified=true" >> "$GITHUB_OUTPUT"
          mkdir -p archive-backup
          cp match_archive.sqlite3 prediction_history.json data.json archive-backup/
          sha256sum archive-backup/* > archive-backup/SHA256SUMS
          cp archive-backup/SHA256SUMS backup-sha256.txt
      - name: Upload separate recovery copy
        uses: actions/upload-artifact@v4
        with:
          name: espn-pre-bsd-recovery
          path: archive-backup/
          retention-days: 90
          if-no-files-found: error
      - name: Test BSD data and report safe mappings (no writes)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python scripts/bsd_sync.py --dry-run
      - name: Import BSD observations and publish new snapshot
        if: steps.backup.outputs.verified == 'true'
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
          BSD_BACKUP_VERIFIED: '1'
        run: python scripts/bsd_sync.py
      - name: Commit changed existing archive and output
        shell: bash
        run: |
          set -euo pipefail
          git add -f match_archive.sqlite3
          git add data.json prediction_history.json bsd_alignment_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Append BSD football observations (ESPN rows preserved)'
            git pull --rebase
            git push
          fi
