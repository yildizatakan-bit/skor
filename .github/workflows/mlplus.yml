name: Update MLPlus
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: write
concurrency:
  group: player-data-db-feature/ml-comparison-20261027
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: feature/ml-comparison-20261027
          path: player-source
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install scikit-learn
      - name: Refresh fixture player stats and retry daily missing data
        run: |
          cp data.json player-source/data.json
          cd player-source
          python ../scripts/refresh_today_players.py
          if [ "$(TZ=Europe/Istanbul date +%H)" = "07" ]; then
            SEASON_STATS_BATCH=3000 python scripts/enrich_player_season.py
            python scripts/build_player_team_features.py
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f player_data.sqlite3
          git add player_team_features.json player_features.json player_coverage.json player_season_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh fixture players and retry missing season statistics"
            git pull --rebase --autostash
            git push origin HEAD:feature/ml-comparison-20261027
          fi
      - run: python scripts/test_mlplus.py
      - run: python scripts/mlplus.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlplus_predictions.json mlplus_player_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MLPlus forecasts"
            git pull --rebase
            git push
          fi

