name: Update MLPlus
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: write
concurrency:
  group: mlplus
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: feature/ml-comparison-20261027
          path: player-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install scikit-learn
      - run: python scripts/mlplus.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlplus_predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MLPlus forecasts"
            git pull --rebase
            git push
          fi
