name: Refresh experimental ML predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "data.json"
      - "scripts/train_ml.py"
      - ".github/workflows/ml-predictions.yml"

permissions:
  contents: write

concurrency:
  group: experimental-ml-predictions
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Train from published snapshot
        run: python scripts/train_ml.py
      - name: Commit only experimental ML output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml_predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh experimental ML 1X2 predictions"
            git push
          fi
