name: Backtest predictions (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate past fixtures without modifying archive
        run: python scripts/backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: v26-backtest-report
          path: backtest_report.json
