name: Test time decay (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run chronological time-decay test
        run: python scripts/test_time_decay.py
      - uses: actions/upload-artifact@v4
        with:
          name: time-decay-report
          path: time_decay_report.json
