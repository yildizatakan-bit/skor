name: Test recency weights (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare recent-form weights
        run: python scripts/test_recency_weights.py
      - uses: actions/upload-artifact@v4
        with:
          name: recency-weight-report
          path: recency_weight_report.json
